# Canonical public configuration for the reported 1D Burgers benchmark.
schema_version: 1

benchmark:
  id: 1d_burgers
  equation: inviscid_burgers
  spatial_dimension: 1
  primary_metric: space_time_rel_l2
  reference: analytical_entropy_shock

runtime:
  device: auto
  dtype: float32

reported_environment:
  python: "3.10.20"
  pytorch: "2.0.1+cu117"
  cuda: "11.7"
  gpu: "NVIDIA GeForce RTX 3090"

seeds: [2026, 7, 42, 100, 31415]

problem:
  x_min: -1.0
  x_max: 1.0
  t_min: 0.0
  t_max: 1.0
  discontinuity_x0: 0.0
  left_state: 1.0
  right_state: 0.0
  left_boundary_state: 1.0
  right_boundary_state: 0.0
  exact_shock_speed: 0.5

network:
  hidden_layers: 6
  hidden_width: 128
  activation: tanh
  output_dimension: 1
  trainable_parameters: 83073

training:
  warmup_iterations: 1000
  continuation_iterations: 9000
  total_iterations: 10000
  resample_collocation_each_iteration: true
  paired_continuation_rng: true
  validation_set: false
  early_stopping: false
  best_checkpoint_selection: false
  optimizer:
    name: AdamW
    warmup_learning_rate: 8.0e-4
    continuation_learning_rate: 3.0e-4
    weight_decay: 1.0e-2
  scheduler:
    name: CosineAnnealingLR
    warmup_eta_min_fraction: 0.05
    continuation_eta_min_fraction: 0.03
  gradient_clip_norm: 1.0

sampling:
  interior_points: 10000
  initial_points: 500
  boundary_points: 500
  initial_sampling: balanced_left_right
  boundary_sampling: balanced_left_right

loss:
  initial_weight: 100.0
  boundary_weight: 1.0
  pde_weight: 1.0

trg:
  h0: 2.0e-2
  h_start: 1.6e-1
  h_end: 4.0e-2
  h_min_factor: 2.0
  h_max_factor: 8.0
  cmin_start: 0.45
  cmin_end: 0.65
  beta: 0.05
  residual_floor: 0.02
  trace_ratio_epsilon: 1.0e-6
  batch_mean_epsilon: 1.0e-8
  weighted_loss_epsilon: 1.0e-8
  relative_error_epsilon: 1.0e-12
  detach_gate: true

reported_evaluation:
  space_time_nx: 1000
  space_time_nt: 401
  final_time_nx: 1000
  representative_seed: 7

paper_figures:
  line_times: [0.25, 0.50, 0.75, 1.00]
  line_grid_nx: 1001
  line_statistic: pointwise_median
  line_band: median_centered_pointwise_rmse_to_exact
  heatmap_nx: 501
  heatmap_nt: 251
  field_source: representative_paired_seed

reported_result:
  pinn_mean: 0.11400558930297015
  pinn_sample_std: 0.0016342529964693973
  trg_pinn_mean: 0.04976606296214274
  trg_pinn_sample_std: 0.003100984534793908
  reduction_percent: 56.34769903264194
  paired_wins: 5
